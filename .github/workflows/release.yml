name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '0.1.0'
      create_tag:
        description: 'Create and push Git tag'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            [[ "$VERSION" =~ ^v ]] && TAG="$VERSION" || TAG="v$VERSION"
          else
            TAG="${{ github.ref_name }}"
          fi
          CLEAN="${TAG#v}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "clean=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $CLEAN)"

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch' && inputs.create_tag == true
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists — skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Xcode version
        run: xcodebuild -version

      - name: Archive
        run: |
          xcodebuild -project clipboat/clipboat.xcodeproj \
                     -scheme clipboat \
                     -configuration Release \
                     -derivedDataPath clipboat/build \
                     -archivePath clipboat/build/clipboat.xcarchive \
                     archive \
                     MARKETING_VERSION=${{ steps.version.outputs.clean }} \
                     CURRENT_PROJECT_VERSION=${{ github.run_number }} \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO

      - name: Package (ZIP + DMG)
        run: |
          APP="clipboat/build/clipboat.xcarchive/Products/Applications/clipboat.app"
          if [ ! -d "$APP" ]; then
            echo "::error::clipboat.app not found at $APP"
            exit 1
          fi

          cd "$(dirname "$APP")"

          # ZIP — preserves symlinks and executable permissions
          zip -yr "$GITHUB_WORKSPACE/clipboat.zip" clipboat.app

          # DMG — drag-to-Applications installer
          mkdir -p dmg_tmp
          cp -R clipboat.app dmg_tmp/
          ln -s /Applications dmg_tmp/Applications
          hdiutil create \
            -volname "clipboat ${{ steps.version.outputs.clean }}" \
            -srcfolder dmg_tmp \
            -ov -format UDZO \
            "$GITHUB_WORKSPACE/clipboat.dmg"
          rm -rf dmg_tmp

      - name: SHA-256 checksums
        working-directory: ${{ github.workspace }}
        run: |
          shasum -a 256 clipboat.zip clipboat.dmg | tee checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipboat-${{ steps.version.outputs.tag }}
          path: |
            clipboat.zip
            clipboat.dmg
            checksums.txt
          if-no-files-found: error

      - name: Extract release notes
        run: |
          python3 - <<'EOF'
          import re, os

          tag = os.environ.get("RELEASE_TAG", "").lstrip("v")
          version = "${{ steps.version.outputs.clean }}"
          tag = tag or version

          gatekeeper_note = """
          > [!NOTE]
          > Because clipboat is open-source and distributed without an Apple Developer Program certificate, macOS Gatekeeper may block it on first launch.
          > **Right-click the app → Open**, or go to **System Settings > Privacy & Security** and click **Open Anyway**.
          """

          try:
              with open("CHANGELOG.md") as f:
                  content = f.read()
              pattern = r"## \[" + re.escape(tag) + r"\][^\n]*\n(.*?)(?=\n## |\Z)"
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip() + "\n" + gatekeeper_note
              else:
                  raise ValueError("section not found")
          except Exception as e:
              print(f"Warning: {e}")
              notes = f"## clipboat {tag}\n\n" + gatekeeper_note

          with open("release_notes.txt", "w") as f:
              f.write(notes)

          print("Release notes written.")
          EOF
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: clipboat ${{ steps.version.outputs.clean }}
          body_path: release_notes.txt
          files: |
            clipboat.zip
            clipboat.dmg
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
